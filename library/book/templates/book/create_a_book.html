{% extends 'base.html' %}
{% block title %}Add book{% endblock %}
{% block content %}
<div class="my-4">
    <h1>Add a New Book</h1>

    <form method="post" action="{% url 'create_a_book' %}" class="col-md-6">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3 d-flex flex-column">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Create</button>
        <a href="{% url 'list_of_books' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
