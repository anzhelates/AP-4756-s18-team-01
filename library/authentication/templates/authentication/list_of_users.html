{% extends 'base.html' %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="my-4">
    <h1>All Users</h1>
    <table class="table table-striped align-middle">
        <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th></tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td><a href="{% url 'authentication:user_details' u.id %}">{{ u.first_name }} {{ u.last_name }}</a></td>
                <td>{{ u.email }}</td>
                <td>{{ u.get_role_name }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted">No users yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
