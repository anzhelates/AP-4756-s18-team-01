{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="my-4">
    <h1>Register</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST" action="{% url 'authentication:register' %}" class="col-md-6">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">First name</label>
            <input type="text" name="first_name" class="form-control" maxlength="20" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Last name</label>
            <input type="text" name="last_name" class="form-control" maxlength="20" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Middle name</label>
            <input type="text" name="middle_name" class="form-control" maxlength="20" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" maxlength="100" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Register as</label>
            <select name="role" class="form-select">
                <option value="0">Visitor</option>
                <option value="1">Librarian</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
        <a href="{% url 'authentication:login' %}" class="btn btn-outline-secondary">Already have an account?</a>
    </form>
</div>
{% endblock %}
