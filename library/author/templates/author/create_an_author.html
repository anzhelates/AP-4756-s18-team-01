{% extends 'base.html' %}
{% block title %}Add Author{% endblock %}
{% block content %}

<div class="my-4">
    <h1>Add a New Author</h1>
    <form method="post" action="{% url 'author:create_an_author' %}" class="col-md-6">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" maxlength="20" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Surname</label>
            <input type="text" name="surname" class="form-control" maxlength="20" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Patronymic</label>
            <input type="text" name="patronymic" class="form-control" maxlength="20" required>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
        <a href="{% url 'author:list_of_authors' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
